info:
  name: Create product
  type: http
  seq: 25

http:
  method: POST
  url: "{{base_url}}/api/products"
  body:
    type: json
    data: |-
      {
        "name": "Produto Exemplo",
        "description": "Descrição do produto",
        "price": 29.90,
        "xpCost": 100,
        "shopkeeperId": 1,
        "categoryId": 1
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
